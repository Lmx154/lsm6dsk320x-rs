[package]
name = "lsm6dsk320x"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Driver for the ST LSM6DSK320X IMU with high-g accelerometer over SPI. Async and blocking, on embedded-hal traits only."
repository = "https://github.com/Lmx154/lsm6dsk320x-rs"
readme = "README.md"
keywords = ["embedded", "no-std", "driver", "imu", "lsm6dsk320x"]
categories = ["embedded", "no-std", "hardware-support"]
rust-version = "1.99"
exclude = ["hil/", "tools/", "docs/", "proptest-regressions/", ".gitignore"]

[features]
defmt = ["dep:defmt"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"
defmt = { version = "1.0.1", optional = true }

[dev-dependencies]
proptest = "1.12"

[workspace]
exclude = ["hil"]
